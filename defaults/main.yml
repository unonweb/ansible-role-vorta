virtualenvs\nfm:*/venv/*\nfm:*/.venv/*\n\n# rust-artefacts\nfm:*/.cargo\nfm:*/.rustup\n\n# flatpak-builder\nfm:*.flatpak-builder\n\n# spotify\nfm:*/.cache/spotify\nfm:*/.config/spotify\nfm:*/.var/app/com.spotify.Client/cache\nfm:*/.var/app/com.spotify.Client/config/spotify\n\n# log-files\nfm:*.log\nfm:*/logs/*\n\n# temp-files\nfm:*/.tmp\nfm:*/temp\nfm:*.swp\nfm:*.bak\n\n# cache-files\nfm:*/.cache\nfm:*/Caches\n\n# recycle-bin-trash\nfm:*/.local/share/Trash/*\nfm:*/.Trash/*\nfm:*/.Trash-*/*\n"
vorta_config_schedule_mode: interval
vorta_config_schedule_interval_count: 3
vorta_config_schedule_interval_unit: hours
vorta_config_schedule_fixed_hour: 3
vorta_config_schedule_fixed_minute: 42
vorta_config_schedule_interval_hours: 3
vorta_config_schedule_interval_minutes: 42
vorta_config_schedule_make_up_missed: true
vorta_config_validation_on: true
vorta_config_validation_weeks: 3
vorta_config_compaction_on: true
vorta_config_compaction_weeks: 3
vorta_config_prune_on: true
vorta_config_prune_hour: 0
vorta_config_prune_day: 7
vorta_config_prune_week: 4
vorta_config_prune_month: 0
vorta_config_prune_year: 0
vorta_config_prune_keep_within: 24H
vorta_config_new_archive_name: "{hostname}-{now:%Y-%m-%d-%H%M%S}"
vorta_config_prune_prefix: ""
# flatpak
vorta_flatpak_scope: system
vorta_flatpak_state: present
vorta_flatpak_override: "{{ role_path }}/files/flatpak_override"
# apt
vorta_apt_state: absent
# autostart
vorta_autostart: true
vorta_autostart_src: flatpak_autostart
vorta_autostart_dst: "/home/{{ vorta_user }}/.config/autostart/vorta.desktop"
# systemd
vorta_systemd_copy: []
vorta_systemd_template: []
vorta_systemd_scope: user
vorta_systemd_enable: []
vorta_systemd_disable: []