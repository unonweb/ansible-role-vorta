---
vorta_user:
# repo
vorta_repo_host:
vorta_repo_user:
vorta_repo_path:
vorta_repo_ssh_private_key_file:
vorta_repo_pw:
# config
vorta_config: vorta.json.j2
vorta_config_init: false
# config options
vorta_config_compression: "lz4"
